name: 24/7 Multi-Bot Automation

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Execute Script
        env:
          WEBHOOK_GENERAL: ${{ secrets.WEBHOOK_GENERAL }}
          WEBHOOK_TECH: ${{ secrets.WEBHOOK_TECH }}
          WEBHOOK_SPORTS: ${{ secrets.WEBHOOK_SPORTS }}
          WEBHOOK_ESPORTS: ${{ secrets.WEBHOOK_ESPORTS }}
          WEBHOOK_AVIATION: ${{ secrets.WEBHOOK_AVIATION }}
          WEBHOOK_RESEARCH: ${{ secrets.WEBHOOK_RESEARCH }}
          WEBHOOK_SPACE: ${{ secrets.WEBHOOK_SPACE }}
        run: python update_bot.py

      - name: Save Deduplication State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_posts.txt [skip ci]" && git push)
